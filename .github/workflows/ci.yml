name: CI

on:
  push:
  pull_request:

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local markdown links
        run: python scripts/check_markdown_links.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: hrpolicy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr -d hrpolicy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint and test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://hr:hr@localhost:5432/hrpolicy
          PYTEST_USE_ENV_DB: "1"
        run: |
          uv python pin 3.12
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Lint, typecheck, test, and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend
        working-directory: backend
        run: |
          uv python pin 3.12
          uv sync --frozen
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Download embedding model
        working-directory: backend
        run: uv run python -m app.download_model
      - name: Playwright critical journey
        working-directory: frontend
        run: pnpm test:e2e
        env:
          CI: "true"

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8101/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Stop
        if: always()
        run: docker compose down -v
