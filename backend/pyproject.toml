[project]
name = "hr-policy-copilot"
version = "0.1.0"
description = "Source-grounded HR policy assistant with hybrid retrieval and verifiable citations."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "huggingface-hub>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pypdf>=6.21.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.18",
  "qdrant-client>=1.12",
  "sentence-transformers>=3.3",
  "sqlalchemy>=2.0.36",
  "torch",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/api/__init__.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "postgres: requires a PostgreSQL DATABASE_URL",
]
